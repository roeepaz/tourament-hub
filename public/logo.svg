  <!-- Orange/accent circle -->
  <circle cx="200" cy="200" r="155" fill="none" stroke="#FF8C00" stroke-width="6"/>
  
  <!-- Wings left -->
  <path d="M 140 200 L 80 180 L 90 190 L 140 210" fill="none" stroke="#001f3f" stroke-width="4" stroke-linecap="round"/>
  <path d="M 130 195 L 70 160 L 85 175 L 125 200" fill="none" stroke="#001f3f" stroke-width="4" stroke-linecap="round"/>
  <path d="M 125 205 L 60 190 L 75 200 L 120 210" fill="none" stroke="#001f3f" stroke-width="4" stroke-linecap="round"/>
  
  <!-- Wings right -->
  <path d="M 260 200 L 320 180 L 310 190 L 260 210" fill="none" stroke="#001f3f" stroke-width="4" stroke-linecap="round"/>
  <path d="M 270 195 L 330 160 L 315 175 L 275 200" fill="none" stroke="#001f3f" stroke-width="4" stroke-linecap="round"/>
  <path d="M 275 205 L 340 190 L 325 200 L 280 210" fill="none" stroke="#001f3f" stroke-width="4" stroke-linecap="round"/>
  
  <!-- Mountains/geometric shapes inside - upper half -->
