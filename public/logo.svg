  <path d="M 160 145 L 175 150 L 165 155" fill="none" stroke="#001f3f" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M 215 140 L 230 145 L 220 150" fill="none" stroke="#001f3f" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  
  <!-- Water waves at bottom -->
  <path d="M 120 200 Q 140 195 160 200 T 200 200 T 240 200 T 280 200" fill="none" stroke="#001f3f" stroke-width="3.5" stroke-linecap="round"/>
  <path d="M 130 220 Q 150 215 170 220 T 210 220 T 250 220 T 290 220" fill="none" stroke="#001f3f" stroke-width="3.5" stroke-linecap="round"/>
  <path d="M 140 240 Q 160 235 180 240 T 220 240 T 260 240" fill="none" stroke="#001f3f" stroke-width="3.5" stroke-linecap="round"/>
